[project]
name = "texmo"
version = "0.1.0"
description = "Experimenting with small language models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "regex>=2025.9.18",
    "requests>=2.32.5",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "torch",
    # GPU JAX on x86_64 Linux (vast.ai-style hosts), CPU JAX everywhere
    # else. ARM Linux (RPi) and macOS get the CPU build; JAX has no
    # CUDA wheels for Windows.
    "jax[cuda13]; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax[cpu]; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "optax",
    "safetensors>=0.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CUDA torch on Windows + x86_64 Linux. macOS and ARM Linux fall
# back to the default PyPI torch (CPU on Linux, MPS on macOS).
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[tool.pytest.ini_options]
testpaths = ["texmo"]

[tool.ruff.lint]
# Only sort imports and flag unused imports. Other warnings were
# mostly noise for this project.
select = ["I", "F401"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.11",
    "transformers>=5.13.1",
]

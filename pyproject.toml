[project]
name = "texmo"
version = "0.1.0"
description = "Experimenting with small language models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "regex>=2025.9.18",
    "requests>=2.32.5",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    # GPU JAX on x86_64 Linux (vast.ai-style hosts), CPU JAX everywhere
    # else. ARM Linux (RPi) and macOS get the CPU build; upstream JAX
    # has no CUDA wheels for Windows (winjax below fills that gap).
    # Pinned to 0.11 on every platform so the fleet runs one JAX
    # version (the ceiling matches metaljax's jax<0.12 requirement --
    # without it non-mac platforms would drift ahead and fork the
    # resolution).
    "jax[cuda13]>=0.11,<0.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax[cpu]>=0.11,<0.12; sys_platform != 'linux' or platform_machine != 'x86_64'",
    # Metal backend for JAX on Apple GPUs (github.com/eterevsky/metaljax,
    # MLX-based) -- gives Mac clients a GPU option next to CPU JAX.
    "metaljax>=0.11.5; sys_platform == 'darwin'",
    # Native Windows CUDA for JAX (github.com/eterevsky/winjax, PJRT
    # plugin loader; auto-registers cuda on import -- set
    # JAX_PLATFORMS=cpu to opt out). Same 0.12 ceiling as jax: winjax
    # releases track the jax version they pin.
    "winjax>=0.11,<0.12; sys_platform == 'win32'",
    "optax",
    "safetensors>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["texmo", "scripts"]

[tool.ruff.lint]
# Only sort imports and flag unused imports. Other warnings were
# mostly noise for this project.
select = ["I", "F401"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.11",
    "transformers>=5.13.1",
]

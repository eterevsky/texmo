[project]
name = "texmo"
version = "0.1.0"
description = "Experimenting with small language models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "regex>=2025.9.18",
    "requests>=2.32.5",
    "rich",
    "scipy>=1.17.1",
    "torch",
    "jax[cpu]",
    "optax",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["texmo"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
